[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server that publishes the mcp-gateway catalogue and plans tool calls"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=1.0",
    "openai>=1.0",
    "mcp>=2.0",
    "aio-pika>=9",
    "grpcio>=1.60",
    "protobuf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
mcp-server = "app.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
